<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RemoteSupport Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .titlebar {
      background: #1e293b;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .titlebar-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
    }
    .titlebar-close {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .titlebar-close:hover { background: #ef4444; color: white; }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      gap: 24px;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .title { font-size: 20px; font-weight: 700; color: #f1f5f9; }
    .subtitle { font-size: 13px; color: #64748b; text-align: center; }
    .input-group { width: 100%; }
    .input-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .code-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      color: #f1f5f9;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 6px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
    }
    .code-input:focus { border-color: #6366f1; }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-connect {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }
    .btn-connect:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-connect:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-disconnect {
      background: rgba(239,68,68,0.1);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.2);
    }
    .btn-disconnect:hover { background: rgba(239,68,68,0.2); }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-idle { background: #64748b; }
    .dot-connecting { background: #f59e0b; animation: pulse 1s infinite; }
    .dot-connected { background: #10b981; }
    .dot-error { background: #ef4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-title">🖥️ RemoteSupport Agent</div>
    <button class="titlebar-close" onclick="closeApp()">✕</button>
  </div>

  <div class="content">
    <div class="logo">🖥️</div>
    <div>
      <div class="title" style="text-align:center">RemoteSupport</div>
      <div class="subtitle" style="margin-top:4px">Technician aapki screen dekh sakta hai</div>
    </div>

    <div id="connectSection" style="width:100%;display:flex;flex-direction:column;gap:16px">
      <div class="input-group">
        <div class="input-label">Session Code</div>
        <input type="text" class="code-input" id="codeInput" maxlength="6" placeholder="ABC123" />
      </div>
      <button class="btn btn-connect" id="connectBtn" onclick="connect()">
        🔗 Connect to Support
      </button>
    </div>

    <div id="connectedSection" class="hidden" style="width:100%;display:flex;flex-direction:column;gap:16px;align-items:center">
      <div class="status">
        <div class="dot dot-connected"></div>
        <span>Session <strong id="sessionCode"></strong> se connected</span>
      </div>
      <div style="font-size:12px;color:#64748b;text-align:center">
        Technician ab aapki screen dekh aur control kar sakta hai
      </div>
      <button class="btn btn-disconnect" onclick="disconnect()">
        ✕ Session Band Karo
      </button>
    </div>

    <div id="statusBar" class="status">
      <div class="dot dot-idle" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>
  </div>

  <script>
    const { ipcRenderer, app } = require("electron");
    const { app: electronApp } = require("@electron/remote") || {};

    function closeApp() {
      const { app } = require("electron").remote || require("@electron/remote") || {};
      window.close();
      require("electron").ipcRenderer.send("disconnect");
      setTimeout(() => process.exit(0), 500);
    }

    function connect() {
      const code = document.getElementById("codeInput").value.trim().toUpperCase();
      if (code.length < 4) { setStatus("connecting", "Code kam se kam 4 characters ka hona chahiye"); return; }
      setStatus("connecting", "Connect ho raha hai...");
      document.getElementById("connectBtn").disabled = true;
      ipcRenderer.send("connect", code);
    }

    function disconnect() {
      ipcRenderer.send("disconnect");
    }

    ipcRenderer.on("status", (event, status, code) => {
      if (status === "connected") {
        document.getElementById("connectSection").classList.add("hidden");
        document.getElementById("connectedSection").classList.remove("hidden");
        document.getElementById("sessionCode").textContent = code;
        setStatus("connected", "Connected");
      } else if (status === "disconnected") {
        document.getElementById("connectSection").classList.remove("hidden");
        document.getElementById("connectedSection").classList.add("hidden");
        document.getElementById("connectBtn").disabled = false;
        setStatus("idle", "Disconnected");
      } else if (status === "error") {
        document.getElementById("connectBtn").disabled = false;
        setStatus("error", "Connection failed — server check karo");
      }
    });

    function setStatus(type, text) {
      const dot = document.getElementById("statusDot");
      dot.className = "dot dot-" + type;
      document.getElementById("statusText").textContent = text;
    }

    document.getElementById("codeInput").addEventListener("keyup", e => {
      if (e.key === "Enter") connect();
    });
  </script>
</body>
</html>
